# Run with prek (https://github.com/j178/prek), a drop-in pre-commit:
#   prek install        # once, installs the git hook
#   prek run --all-files
# stylua uses .stylua.toml, and lua/neat/statusline/.stylua.toml for the
# statusline (single quotes), relative to the file it formats.
repos:
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua-github
        files: ^(lua|plugin|tests)/.*\.lua$
  - repo: local
    hooks:
      # Needs nvim and lua-language-server on $PATH; nui.nvim (for its types)
      # is cloned into deps/ the first time.
      - id: lua-language-server
        name: lua-language-server
        entry: >-
          sh -c '[ -d deps/nui.nvim ] || git clone -q --depth 1 https://github.com/MunifTanjim/nui.nvim deps/nui.nvim;
          VIMRUNTIME=$(nvim --clean --headless -c "lua io.write(vim.env.VIMRUNTIME)" -c q)
          exec lua-language-server --check . --checklevel=Warning'
        language: system
        files: \.lua$|^\.luarc\.json$
        pass_filenames: false
