name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [off, statusline, ui, cmdline]
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Fetch nui.nvim
        if: matrix.scenario == 'cmdline'
        uses: actions/checkout@v7
        with:
          repository: MunifTanjim/nui.nvim
          ref: 10fc361835c856ba4233ef5ea135b919bf3dce97 # keep in step with nvim-pack-lock.json in the dotfiles
          path: deps/nui.nvim
      - name: Run tests/smoke.lua
        env:
          SMOKE: ${{ matrix.scenario }}
        run: |
          nvim --version | head -1
          nvim --headless --clean \
            --cmd "set rtp^=$PWD/deps/nui.nvim" \
            --cmd "set rtp^=$PWD" \
            --cmd 'luafile tests/smoke.lua'

  stylua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0 # keep in step with .pre-commit-config.yaml
          args: --check lua plugin tests

  luals:
    name: type check
    runs-on: ubuntu-24.04
    env:
      LUALS_VERSION: 3.18.1 # bump on purpose: new versions add diagnostics
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Fetch nui.nvim (types for the cmdline module)
        uses: actions/checkout@v7
        with:
          repository: MunifTanjim/nui.nvim
          ref: 10fc361835c856ba4233ef5ea135b919bf3dce97 # keep in step with nvim-pack-lock.json in the dotfiles
          path: deps/nui.nvim
      - name: Install lua-language-server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - name: Check (warnings and errors)
        run: |
          export VIMRUNTIME=$(nvim --clean --headless -c 'lua io.write(vim.env.VIMRUNTIME)' -c q)
          lua-language-server --check "$PWD" --configpath "$PWD/.luarc.json" --checklevel=Warning
      - name: Every function documents its parameters
        run: nvim --headless --clean -l tests/annotations.lua
