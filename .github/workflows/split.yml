name: split

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish one branch per plugin
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          scripts/split.sh --push
