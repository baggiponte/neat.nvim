name: split

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # vimdoc for `:h cmdline.nvim` etc., generated from each README
      - uses: kdheepak/panvimdoc@main
        with:
          vimdoc: cmdline.nvim
          pandoc: cmdline/README.md
          description: centred cmdline popup on top of ui2
          demojify: true
          treesitter: true
      - uses: kdheepak/panvimdoc@main
        with:
          vimdoc: ui.nvim
          pandoc: ui/README.md
          description: select, input, notify and indent
          demojify: true
          treesitter: true
      - uses: kdheepak/panvimdoc@main
        with:
          vimdoc: statusline.nvim
          pandoc: statusline/README.md
          description: a small, cached statusline
          demojify: true
          treesitter: true
      - name: Commit vimdoc
        run: |
          for p in cmdline ui statusline; do
            mkdir -p "$p/doc"
            mv "doc/$p.nvim.txt" "$p/doc/$p.nvim.txt"
          done
          rmdir doc 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add cmdline/doc ui/doc statusline/doc
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate vimdoc from the READMEs"
            git push origin HEAD:main
          fi
      - name: Publish one branch per plugin
        run: |
          scripts/split.sh --push
